name: Lavender garden

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-lavender.svg?color_snake=#9670D6&color_dots=#F1EAFB,#E0D0F7,#C9B2F2,#A98AE0,#6B45B0
            dist/snake-lavender-dark.svg?color_snake=#E3C68E&color_dots=#221A33,#3D2C5C,#6B4FA0,#9C7FD6,#C9B2F2

      - name: Draw contribution bloom
        run: python3 scripts/bloom.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
